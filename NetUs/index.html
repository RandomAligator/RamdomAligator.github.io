<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Us. — Every Little Moment</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============================================================
     SCREEN 1 — VIDEO INTRO (plays background.mp4 once, full-screen)
     ============================================================ -->
<section id="screen-video-intro" class="screen screen--video-intro active">
  <video id="bg-video" class="bg-video" playsinline>
    <source src="assets/background.mp4" type="video/mp4">
  </video>
  <div class="video-intro-scrim"></div>
  <button id="intro-play-btn" class="video-intro-play" type="button" aria-label="Play">&#9658;</button>
</section>

<!-- ============================================================
     SCREEN 2 — PROFILE SELECT (the "who's watching" intro)
     ============================================================ -->
<section id="screen-profiles" class="screen screen--profiles">

  <div class="bg-video-fallback" id="bg-fallback"></div>
  <div class="scrim"></div>
  <canvas id="hearts-canvas" class="hearts-canvas"></canvas>

  <div class="profiles-wrap">
    <p class="eyebrow">tanmay &amp; naina present</p>
    <h1 class="wordmark">Us.</h1>
    <h2 class="profiles-title">Who's loved today?</h2>

    <div id="profiles-grid" class="profiles-grid">
      <!-- profile icons injected by script.js from the CATEGORIES list -->
    </div>

    <p class="profiles-hint">tap a moment to open the album</p>
  </div>
</section>

<!-- ============================================================
     SCREEN 2 — BROWSE (netflix-style rows for the chosen category)
     ============================================================ -->
<section id="screen-browse" class="screen screen--browse">

  <header class="browse-header">
    <div class="browse-logo">Us.</div>
    <button id="switch-profile-btn" class="switch-profile" type="button">
      <span id="current-avatar" class="mini-avatar"></span>
      <span id="current-label">Kisses</span>
      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true">
        <path d="M1 3l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none"/>
      </svg>
    </button>
  </header>

  <div class="browse-hero" id="browse-hero">
    <div class="browse-hero-scrim"></div>
    <div class="browse-hero-content">
      <p class="browse-hero-eyebrow">a collection of</p>
      <h2 id="browse-hero-title" class="browse-hero-title">Kisses</h2>
      <p id="browse-hero-count" class="browse-hero-count">0 memories</p>
    </div>
  </div>

  <div class="rows-wrap">

    <!-- Rows for the current category's media are generated by script.js —
         media is split into multiple scrollable rows instead of one long row. -->
    <div id="main-rows-container"></div>

    <div class="row" id="more-row">
      <h3 class="row-title">More Moments</h3>
      <div class="row-track-wrap">
        <button class="row-arrow row-arrow--left" data-target="more-row-track" data-dir="-1" aria-label="Scroll left">&#10094;</button>
        <div class="row-track" id="more-row-track"></div>
        <button class="row-arrow row-arrow--right" data-target="more-row-track" data-dir="1" aria-label="Scroll right">&#10095;</button>
      </div>
    </div>

  </div>
</section>

<!-- ============================================================
     LIGHTBOX — fullscreen player / zoom viewer
     ============================================================ -->
<div id="lightbox" class="lightbox">
  <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
  <button id="lightbox-prev" class="lightbox-nav lightbox-nav--prev" aria-label="Previous">&#10094;</button>
  <button id="lightbox-next" class="lightbox-nav lightbox-nav--next" aria-label="Next">&#10095;</button>

  <div class="lightbox-stage" id="lightbox-stage">
    <!-- img or video injected here by script.js -->
  </div>

  <div class="lightbox-footer">
    <span id="lightbox-counter" class="lightbox-counter"></span>
    <span class="lightbox-hint">scroll / pinch to zoom &middot; drag to pan &middot; double-click to reset</span>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
