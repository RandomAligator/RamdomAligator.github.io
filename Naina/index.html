<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pretty Flowers, For The Pretty Girl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Great+Vibes&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --dusk-deep: #1b1240;
        --dusk-mid: #5a3a72;
        --dusk-pink: #e88bab;
        --pond-deep: #0e3b2e;
        --pond-mid: #1f6b4f;
        --lily-white: #fff7ec;
        --lily-pink: #f6b6c9;
        --gold: #e9c46a;
        --gold-soft: #f7dfa3;
        --peacock-teal: #1c7c73;
        --peacock-blue: #2a5d8a;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
        font-family: "Cormorant Garamond", serif;
        background: var(--dusk-deep);
        color: var(--lily-white);
      }

      /* ---------- SCENE BACKGROUND ---------- */
      .scene {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: linear-gradient(
          to bottom,
          var(--dusk-deep) 0%,
          var(--dusk-mid) 32%,
          var(--dusk-pink) 55%,
          #cf7fa0 62%,
          var(--pond-mid) 63%,
          var(--pond-deep) 100%
        );
        overflow: hidden;
      }

      /* stars */
      .star {
        position: absolute;
        width: 3px;
        height: 3px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 6px 1px rgba(255, 255, 255, 0.8);
        animation: twinkle 3.5s ease-in-out infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 0.15;
          transform: scale(0.7);
        }
        50% {
          opacity: 1;
          transform: scale(1.3);
        }
      }

      /* moon */
      .moon {
        position: absolute;
        top: 6%;
        right: 12%;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 35%,
          #fffef2,
          var(--gold-soft) 60%,
          #e8d9a0 100%
        );
        box-shadow: 0 0 60px 18px rgba(247, 223, 163, 0.35);
      }

      /* peacocks flying */
      .peacock {
        position: absolute;
        width: 120px;
        opacity: 0.92;
        filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      .peacock svg {
        width: 100%;
        height: auto;
        display: block;
      }
      .p1 {
        top: 14%;
        animation: flyRight 26s linear infinite;
      }
      .p2 {
        top: 24%;
        width: 90px;
        animation: flyLeft 32s linear infinite;
        animation-delay: -6s;
      }
      .p3 {
        top: 9%;
        width: 70px;
        animation: flyRight 40s linear infinite;
        animation-delay: -14s;
        opacity: 0.75;
      }

      @keyframes flyRight {
        0% {
          transform: translateX(-20vw) translateY(0) scaleX(1);
        }
        48% {
          transform: translateX(60vw) translateY(-18px) scaleX(1);
        }
        50% {
          transform: translateX(64vw) translateY(-18px) scaleX(-1);
        }
        100% {
          transform: translateX(120vw) translateY(10px) scaleX(-1);
        }
      }
      @keyframes flyLeft {
        0% {
          transform: translateX(120vw) translateY(0) scaleX(-1);
        }
        48% {
          transform: translateX(20vw) translateY(-14px) scaleX(-1);
        }
        50% {
          transform: translateX(16vw) translateY(-14px) scaleX(1);
        }
        100% {
          transform: translateX(-20vw) translateY(8px) scaleX(1);
        }
      }

      .wing {
        animation: flap 1.1s ease-in-out infinite;
        transform-origin: 60% 55%;
      }
      @keyframes flap {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-14deg);
        }
      }

      /* lily pond */
      .pond {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 40%;
      }
      .lilypad {
        position: absolute;
        border-radius: 50% 50% 50% 0;
        background: radial-gradient(ellipse at 35% 35%, #2f8f5e, #124f34 80%);
        box-shadow: inset -6px -6px 14px rgba(0, 0, 0, 0.25);
        animation: bob 6s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-4px) rotate(2deg);
        }
      }
      .lily-flower {
        position: absolute;
        width: 46px;
        height: 46px;
      }
      .lily-flower svg {
        width: 100%;
        height: 100%;
      }

      /* falling flowers */
      .petal {
        position: absolute;
        top: -40px;
        font-size: 20px;
        user-select: none;
        animation-name: fall;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
        opacity: 0.9;
      }
      @keyframes fall {
        0% {
          transform: translateY(-5vh) translateX(0) rotate(0deg);
          opacity: 0.9;
        }
        100% {
          transform: translateY(110vh) translateX(40px) rotate(340deg);
          opacity: 0.3;
        }
      }

      /* ---------- CONTENT ---------- */
      .content {
        position: relative;
        z-index: 2;
        height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1vh;
        padding: 1.5vh 5vw;
        text-align: center;
        overflow: hidden;
      }

      .eyebrow {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        font-size: clamp(0.6rem, 1.6vh, 0.85rem);
        color: var(--gold-soft);
        text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      }

      h1.main-title {
        font-family: "Great Vibes", cursive;
        font-weight: 500;
        font-size: clamp(2rem, 7vh, 6rem);
        line-height: 1.8;
        background: linear-gradient(
          180deg,
          #fff7ec,
          var(--gold-soft) 60%,
          var(--gold)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 6px 30px rgba(233, 196, 106, 0.35);
      }

      h2.sub-title {
        font-family: "Dancing Script", cursive;
        font-weight: 700;
        font-size: clamp(1.1rem, 3.2vh, 2.6rem);
        color: var(--lily-pink);
        text-shadow: 0 3px 14px rgba(0, 0, 0, 0.4);
      }

      .divider {
        width: min(120px, 20vw);
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--gold-soft),
          transparent
        );
        margin: 0.4vh 0;
      }

      /* slideshow */
      .stage {
        position: relative;
        width: min(700px, 80vw, 50vh);
        aspect-ratio: 4/5;
        border-radius: 14px;
        overflow: hidden;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.45),
          0 0 0 1px rgba(233, 196, 106, 0.25),
          0 0 40px rgba(233, 196, 106, 0.15);
        background: linear-gradient(160deg, #2a1b45, #123d2c);
        flex-shrink: 0;
      }
      .frame-inner {
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(247, 223, 163, 0.55);
        border-radius: 8px;
        pointer-events: none;
        z-index: 5;
      }
      .stage img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transform: scale(1.04);
        transition:
          opacity 1.4s ease,
          transform 6s ease;
      }
      .stage img.active {
        opacity: 1;
        transform: scale(1);
        z-index: 2;
      }
      .stage .missing {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: 1.1rem;
        color: rgba(255, 247, 236, 0.75);
        padding: 2rem;
      }

      .caption {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-size: clamp(0.75rem, 1.9vh, 1.05rem);
        color: var(--gold-soft);
        letter-spacing: 0.06em;
      }

      .footer-note {
        font-family: "Dancing Script", cursive;
        font-size: clamp(0.9rem, 2.4vh, 1.4rem);
        color: var(--lily-white);
        opacity: 0.85;
      }

      /* start overlay for music autoplay policies */
      .veil {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(circle at center, #2a1b45, #0e0620 80%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.6rem;
        text-align: center;
        transition: opacity 1s ease;
      }
      .veil h3 {
        font-family: "Great Vibes", cursive;
        font-size: clamp(2.2rem, 6vw, 3.4rem);
        color: var(--gold-soft);
      }
      .veil p {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        color: var(--lily-pink);
        max-width: 340px;
      }
      .enter-btn {
        font-family: "Dancing Script", cursive;
        font-size: 1.5rem;
        background: linear-gradient(135deg, var(--gold-soft), var(--gold));
        color: #3a2410;
        border: none;
        padding: 0.8rem 2.4rem;
        border-radius: 40px;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(233, 196, 106, 0.4);
        transition: transform 0.3s ease;
      }
      .enter-btn:hover {
        transform: translateY(-2px) scale(1.03);
      }
      .veil.hide {
        opacity: 0;
        pointer-events: none;
      }

      .music-toggle {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 40;
        background: rgba(27, 18, 64, 0.6);
        border: 1px solid rgba(247, 223, 163, 0.5);
        color: var(--gold-soft);
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        padding: 0.5rem 1rem;
        border-radius: 30px;
        cursor: pointer;
        backdrop-filter: blur(4px);
      }

      /* ---------- MOBILE ADJUSTMENTS ---------- */
      @media (max-width: 640px) {
        .content {
          padding: 1.2vh 6vw;
          gap: 0.8vh;
        }

        .moon {
          width: 56px;
          height: 56px;
          top: 4%;
          right: 8%;
        }

        .peacock {
          width: 80px;
        }
        .p1 {
          width: 80px;
        }
        .p2 {
          width: 62px;
        }
        .p3 {
          width: 48px;
        }

        .stage {
          width: min(92vw, calc(40vh * 0.75));
          aspect-ratio: 3/4;
        }

        .veil p {
          max-width: 280px;
          font-size: 0.95rem;
        }
        .veil h3 {
          font-size: 2.2rem;
        }
        .enter-btn {
          font-size: 1.25rem;
          padding: 0.7rem 2rem;
        }

        .music-toggle {
          bottom: 14px;
          right: 14px;
          font-size: 0.85rem;
          padding: 0.4rem 0.8rem;
        }

        .petal {
          font-size: 14px !important;
        }
      }

      @media (max-width: 400px) {
        .stage {
          width: min(94vw, calc(38vh * 0.75));
        }
        .peacock {
          width: 64px;
        }
        .p1 {
          width: 64px;
        }
        .p2 {
          width: 50px;
        }
        .p3 {
          width: 38px;
        }
      }

      /* ---------- SHORT / LANDSCAPE SCREENS ---------- */
      @media (max-height: 500px) {
        .content {
          gap: 0.6vh;
          padding: 1vh 5vw;
        }
        .eyebrow {
          display: none;
        }
        .stage {
          width: min(60vw, calc(65vh * 0.8));
          aspect-ratio: 4/5;
        }
        .divider {
          margin: 0.2vh 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- entry veil (needed so browsers allow audio to play) -->
    <div class="veil" id="veil">
      <h3>A little garden awaits…</h3>
      <p>— made just for you.</p>
      <button class="enter-btn" id="enterBtn">Open the garden ✿</button>
    </div>

    <!-- animated scene -->
    <div class="scene" id="scene">
      <div class="moon"></div>
      <!-- stars injected by JS -->
      <!-- peacocks -->
      <div class="peacock p1">
        <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
          <g class="wing">
            <path
              d="M100 70 C40 10, 10 20, 5 60 C40 55, 70 60, 100 70Z"
              fill="#1c7c73"
            />
            <path
              d="M100 70 C60 20, 30 30, 25 55 C55 55, 80 62, 100 70Z"
              fill="#2a9d8f"
            />
          </g>
          <ellipse cx="115" cy="75" rx="28" ry="18" fill="#0f5c53" />
          <circle cx="140" cy="60" r="12" fill="#1c7c73" />
          <path
            d="M140 50 Q150 40 158 46"
            stroke="#e9c46a"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="146" cy="57" r="2" fill="#111" />
          <path
            d="M90 85 Q60 130 30 132 M90 85 Q65 125 40 120 M90 85 Q70 118 50 108"
            stroke="#2a5d8a"
            stroke-width="3"
            fill="none"
            opacity="0.8"
          />
          <circle cx="35" cy="128" r="6" fill="#e9c46a" opacity="0.85" />
          <circle cx="45" cy="116" r="5" fill="#e88bab" opacity="0.85" />
        </svg>
      </div>

      <div class="peacock p2">
        <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
          <g class="wing">
            <path
              d="M100 70 C40 10, 10 20, 5 60 C40 55, 70 60, 100 70Z"
              fill="#2a5d8a"
            />
            <path
              d="M100 70 C60 20, 30 30, 25 55 C55 55, 80 62, 100 70Z"
              fill="#3d7ab5"
            />
          </g>
          <ellipse cx="115" cy="75" rx="28" ry="18" fill="#0f3d5c" />
          <circle cx="140" cy="60" r="12" fill="#2a5d8a" />
          <path
            d="M140 50 Q150 40 158 46"
            stroke="#e9c46a"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
          <circle cx="146" cy="57" r="2" fill="#111" />
          <path
            d="M90 85 Q60 130 30 132 M90 85 Q65 125 40 120 M90 85 Q70 118 50 108"
            stroke="#1c7c73"
            stroke-width="3"
            fill="none"
            opacity="0.8"
          />
        </svg>
      </div>

      <div class="peacock p3">
        <svg viewBox="0 0 200 140" xmlns="http://www.w3.org/2000/svg">
          <g class="wing">
            <path
              d="M100 70 C40 10, 10 20, 5 60 C40 55, 70 60, 100 70Z"
              fill="#1c7c73"
            />
          </g>
          <ellipse cx="115" cy="75" rx="28" ry="18" fill="#0f5c53" />
          <circle cx="140" cy="60" r="12" fill="#1c7c73" />
          <path
            d="M140 50 Q150 40 158 46"
            stroke="#e9c46a"
            stroke-width="3"
            fill="none"
            stroke-linecap="round"
          />
        </svg>
      </div>

      <!-- pond -->
      <div class="pond" id="pond"></div>
    </div>

    <!-- falling petals injected by JS -->
    <div id="petals"></div>

    <!-- main content -->
    <div class="content">
      <div class="eyebrow">a little something, just for you</div>
      <h1 class="main-title">For a pretty girl !</h1>
      <h2 class="sub-title">some peacocks, lilies, and the moon</h2>
      <div class="divider"></div>

      <div class="stage" id="stage">
        <div class="frame-inner"></div>
        <!-- img1..img6 will be added by JS, with graceful fallback -->
      </div>

      <div class="caption">
        every petal, every peacock feather — a little like you
      </div>

      <div class="footer-note">made with love ✿</div>
    </div>

    <button class="music-toggle" id="musicToggle">♪ pause music</button>
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

    <script>
      // ---------- stars ----------
      const scene = document.getElementById("scene");
      const starCount = 60;
      for (let i = 0; i < starCount; i++) {
        const s = document.createElement("div");
        s.className = "star";
        s.style.left = Math.random() * 100 + "%";
        s.style.top = Math.random() * 40 + "%"; // keep stars in sky band
        s.style.animationDelay = Math.random() * 3.5 + "s";
        s.style.animationDuration = 2.5 + Math.random() * 3 + "s";
        scene.appendChild(s);
      }

      // ---------- lily pads & flowers on pond ----------
      const pond = document.getElementById("pond");
      const padPositions = [
        { l: "6%", b: "10%", s: 70 },
        { l: "20%", b: "30%", s: 55 },
        { l: "38%", b: "8%", s: 90 },
        { l: "55%", b: "34%", s: 60 },
        { l: "72%", b: "12%", s: 80 },
        { l: "88%", b: "28%", s: 50 },
        { l: "12%", b: "55%", s: 65 },
        { l: "46%", b: "58%", s: 70 },
        { l: "80%", b: "55%", s: 58 },
      ];
      padPositions.forEach((p, i) => {
        const pad = document.createElement("div");
        pad.className = "lilypad";
        pad.style.left = p.l;
        pad.style.bottom = p.b;
        pad.style.width = p.s + "px";
        pad.style.height = p.s * 0.75 + "px";
        pad.style.animationDelay = i * 0.4 + "s";
        pond.appendChild(pad);
      });

      const lilySVG = `
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <g>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#fff7ec" transform="rotate(0 50 55)"/>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#f6b6c9" opacity="0.9" transform="rotate(60 50 55)"/>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#fff7ec" opacity="0.9" transform="rotate(120 50 55)"/>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#f6b6c9" opacity="0.85" transform="rotate(180 50 55)"/>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#fff7ec" opacity="0.85" transform="rotate(240 50 55)"/>
        <ellipse cx="50" cy="55" rx="14" ry="22" fill="#f6b6c9" opacity="0.8" transform="rotate(300 50 55)"/>
        <circle cx="50" cy="55" r="9" fill="#e9c46a"/>
      </g>
    </svg>`;
      const flowerSpots = [
        { l: "16%", b: "20%" },
        { l: "42%", b: "42%" },
        { l: "66%", b: "18%" },
        { l: "84%", b: "40%" },
      ];
      flowerSpots.forEach((f, i) => {
        const fl = document.createElement("div");
        fl.className = "lily-flower";
        fl.style.left = f.l;
        fl.style.bottom = f.b;
        fl.style.animation = `bob ${5 + i}s ease-in-out infinite`;
        fl.innerHTML = lilySVG;
        pond.appendChild(fl);
      });

      // ---------- falling petals ----------
      const petalContainer = document.getElementById("petals");
      petalContainer.style.position = "fixed";
      petalContainer.style.inset = "0";
      petalContainer.style.zIndex = "3";
      petalContainer.style.pointerEvents = "none";
      const petalEmojis = ["🌸", "🌺", "✿", "❀"];
      const petalCount = 22;
      for (let i = 0; i < petalCount; i++) {
        const p = document.createElement("div");
        p.className = "petal";
        p.textContent =
          petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
        p.style.left = Math.random() * 100 + "%";
        p.style.fontSize = 14 + Math.random() * 14 + "px";
        p.style.animationDuration = 8 + Math.random() * 10 + "s";
        p.style.animationDelay = Math.random() * 10 + "s";
        petalContainer.appendChild(p);
      }

      // ---------- slideshow ----------
      const stage = document.getElementById("stage");
      const imageFiles = [
        "img1.png",
        "img2.png",
        "img3.png",
        "img4.png",
        "img5.png",
        "img6.png",
        "img7.png",
        "img8.png",
      ];
      let loadedAny = false;
      const imgEls = imageFiles.map((src, idx) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "memory " + (idx + 1);
        if (idx === 0) img.classList.add("active");
        stage.appendChild(img);
        return img;
      });

      let current = 0;
      function nextSlide() {
        const prev = imgEls[current];
        current = (current + 1) % imgEls.length;
        const next = imgEls[current];
        prev.classList.remove("active");
        next.classList.add("active");
      }
      setInterval(nextSlide, 4200);

      // graceful message if images are missing
      let missingCount = 0;
      imgEls.forEach((img) => {
        img.addEventListener("error", () => {
          missingCount++;
          if (missingCount === imgEls.length) {
            const msg = document.createElement("div");
            msg.className = "missing";
            msg.innerHTML =
              "Add <b>img1.png</b> – <b>img6.png</b><br>next to this file to see your photos here 🌸";
            stage.appendChild(msg);
          }
        });
      });

      // ---------- music + entry veil ----------
      const veil = document.getElementById("veil");
      const enterBtn = document.getElementById("enterBtn");
      const music = document.getElementById("bgMusic");
      const musicToggle = document.getElementById("musicToggle");

      enterBtn.addEventListener("click", () => {
        veil.classList.add("hide");
        music.volume = 0.55;
        music.play().catch(() => {
          /* file may be missing, ignore */
        });
        setTimeout(() => (veil.style.display = "none"), 1000);
      });

      let playing = true;
      musicToggle.addEventListener("click", () => {
        if (playing) {
          music.pause();
          musicToggle.textContent = "♪ play music";
        } else {
          music.play().catch(() => {});
          musicToggle.textContent = "♪ pause music";
        }
        playing = !playing;
      });
    </script>
  </body>
</html>
