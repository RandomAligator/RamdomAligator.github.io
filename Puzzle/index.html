<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Every Piece of You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500;700&family=Jost:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --blush: #f9e6ec;
        --rose: #e39ab0;
        --berry: #8c2f49;
        --berry-dark: #5c1c30;
        --cream: #fff8f3;
        --gold: #cfa15a;
        --ink: #3a2530;
        --shadow: 0 10px 30px rgba(140, 47, 73, 0.15);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background:
          radial-gradient(circle at 15% 10%, #fdf1f4 0%, transparent 45%),
          radial-gradient(circle at 85% 90%, #fbe9ee 0%, transparent 45%),
          var(--blush);
        color: var(--ink);
        font-family: "Jost", sans-serif;
        overflow-x: hidden;
      }

      h1,
      h2,
      h3,
      .script {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 600;
        color: var(--berry-dark);
        margin: 0;
      }

      .handwritten {
        font-family: "Caveat", cursive;
        color: var(--berry);
      }

      button {
        font-family: "Jost", sans-serif;
        cursor: pointer;
        border: none;
        outline: none;
      }
      button:focus-visible {
        outline: 2px solid var(--berry);
        outline-offset: 3px;
      }

      .screen {
        display: none;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 32px 18px 60px;
        position: relative;
        box-sizing: border-box;
      }
      .screen.active {
        display: flex;
      }

      /* ---------- floating petals ambience ---------- */
      .petal {
        position: fixed;
        top: -40px;
        font-size: 18px;
        color: var(--rose);
        opacity: 0.55;
        pointer-events: none;
        animation: fall linear infinite;
        z-index: 0;
        user-select: none;
      }
      @keyframes fall {
        0% {
          transform: translateY(-5vh) translateX(0) rotate(0deg);
        }
        100% {
          transform: translateY(105vh) translateX(30px) rotate(280deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .petal {
          animation: none;
          display: none;
        }
      }

      /* ============ WELCOME SCREEN ============ */
      #welcome .envelope-wrap {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 640px;
      }
      .seal {
        width: 74px;
        height: 74px;
        margin: 0 auto 22px;
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          #d9536f,
          var(--berry-dark)
        );
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--cream);
        font-size: 30px;
        animation: seal-pop 900ms ease-out both;
      }
      @keyframes seal-pop {
        0% {
          transform: scale(0) rotate(-25deg);
          opacity: 0;
        }
        70% {
          transform: scale(1.12) rotate(8deg);
          opacity: 1;
        }
        100% {
          transform: scale(1) rotate(0deg);
        }
      }

      #welcome h1 {
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        line-height: 1.15;
        margin-bottom: 14px;
      }
      #welcome .sub {
        font-family: "Caveat", cursive;
        font-size: clamp(1.3rem, 3vw, 1.7rem);
        color: var(--berry);
        margin-bottom: 26px;
      }
      #welcome p.note {
        font-size: 1.02rem;
        line-height: 1.75;
        color: #5a4550;
        margin: 0 auto 34px;
        max-width: 480px;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--rose), var(--berry));
        color: #fff8f3;
        padding: 15px 38px;
        border-radius: 40px;
        font-size: 1.02rem;
        letter-spacing: 0.3px;
        box-shadow: var(--shadow);
        transition:
          transform 200ms ease,
          box-shadow 200ms ease;
      }
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 34px rgba(140, 47, 73, 0.24);
      }
      .btn-primary:active {
        transform: translateY(0);
      }

      .btn-ghost {
        background: transparent;
        color: var(--berry);
        border: 1.5px solid var(--rose) !important;
        padding: 11px 26px;
        border-radius: 40px;
        font-size: 0.92rem;
      }
      .btn-ghost:hover {
        background: rgba(227, 154, 176, 0.15);
      }

      /* ============ GARDEN / LEVEL SELECT ============ */
      #garden {
        padding-top: 40px;
      }
      #garden .heading {
        text-align: center;
        margin-bottom: 8px;
        z-index: 1;
      }
      #garden h2 {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
      }
      #garden .progress-line {
        font-family: "Caveat", cursive;
        font-size: 1.25rem;
        color: var(--berry);
        text-align: center;
        margin-bottom: 36px;
      }

      .vine {
        position: relative;
        max-width: 560px;
        width: 100%;
        z-index: 1;
      }
      .vine::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 3px;
        background: repeating-linear-gradient(
          to bottom,
          var(--rose) 0 10px,
          transparent 10px 18px
        );
        transform: translateX(-50%);
        border-radius: 3px;
      }

      .node-row {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }
      .node-row:nth-child(odd) .node-card {
        margin-right: auto;
      }
      .node-row:nth-child(even) .node-card {
        margin-left: auto;
      }

      .node-card {
        width: calc(50% - 46px);
        min-width: 150px;
        background: var(--cream);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: transform 160ms ease;
      }
      .node-card.playable {
        cursor: pointer;
      }
      .node-card.playable:hover {
        transform: translateY(-3px);
      }
      .node-card.locked {
        opacity: 0.55;
        filter: grayscale(0.5);
        cursor: not-allowed;
      }

      .flower {
        width: 44px;
        height: 44px;
        flex: 0 0 auto;
        position: relative;
      }
      .flower .petal-el {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 14px;
        background: var(--rose);
        border-radius: 50% 50% 50% 50%/60% 60% 40% 40%;
        transform-origin: 0% 100%;
        transition: all 400ms ease;
      }
      .flower .core {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        background: var(--gold);
        z-index: 2;
      }
      .node-card.locked .flower .petal-el {
        background: #c9c0c4;
        transform: scale(0.4) translate(-50%, -100%) rotate(var(--r));
      }
      .node-card.unlocked .flower .petal-el {
        background: var(--rose);
        transform: scale(0.55) translate(-50%, -100%) rotate(var(--r));
      }
      .node-card.done .flower .petal-el {
        background: linear-gradient(var(--rose), var(--berry));
        transform: scale(1) translate(-50%, -100%) rotate(var(--r));
      }

      .node-text .lvl-num {
        font-family: "Caveat", cursive;
        font-size: 0.95rem;
        color: var(--gold);
        display: block;
        margin-bottom: 2px;
      }
      .node-text .lvl-title {
        font-family: "Cormorant Garamond", serif;
        font-style: italic;
        font-weight: 600;
        font-size: 1.12rem;
        color: var(--berry-dark);
      }
      .node-text .lvl-meta {
        font-size: 0.74rem;
        color: #9a7f88;
        margin-top: 2px;
      }

      /* ============ PUZZLE SCREEN ============ */
      #puzzle {
        padding-top: 26px;
      }
      #puzzle .puzzle-top {
        width: 100%;
        max-width: 640px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        z-index: 1;
      }
      #puzzle .puzzle-title {
        text-align: center;
        flex: 1;
      }
      #puzzle .puzzle-title h2 {
        font-size: clamp(1.4rem, 3.4vw, 1.9rem);
      }
      #puzzle .puzzle-title .lvl-num {
        font-family: "Caveat", cursive;
        color: var(--gold);
        font-size: 1rem;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--cream);
        box-shadow: var(--shadow);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        color: var(--berry);
        flex: 0 0 auto;
      }

      .board-wrap {
        position: relative;
        z-index: 1;
      }
      #board {
        display: grid;
        gap: 3px;
        background: var(--berry-dark);
        padding: 4px;
        border-radius: 14px;
        box-shadow: var(--shadow);
        width: min(92vw, 70vh, 460px);
        aspect-ratio: 1/1;
        touch-action: manipulation;
        transition:
          gap 900ms ease,
          padding 900ms ease,
          border-radius 900ms ease,
          background 900ms ease;
      }
      #board.solving {
        gap: 0;
        padding: 0;
        border-radius: 8px;
        background: transparent;
        pointer-events: none;
      }
      .tile {
        position: relative;
        background-repeat: no-repeat;
        border-radius: 4px;
        cursor: pointer;
        transition:
          transform 140ms ease,
          outline-color 140ms ease,
          border-radius 900ms ease;
        outline: 3px solid transparent;
        outline-offset: -3px;
      }
      .tile:hover {
        transform: scale(0.97);
      }
      .tile.selected {
        outline-color: var(--gold);
        z-index: 2;
      }
      .tile.correct {
        outline-color: rgba(140, 47, 73, 0.35);
      }
      #board.solving .tile {
        outline-color: transparent !important;
        border-radius: 0;
        transform: none !important;
      }
      #board.solving .hint-num {
        display: none !important;
      }
      .tile .hint-num {
        position: absolute;
        top: 2px;
        left: 4px;
        font-size: 10px;
        color: #fff;
        background: rgba(58, 37, 48, 0.55);
        padding: 0 4px;
        border-radius: 6px;
        display: none;
        font-family: "Jost", sans-serif;
      }
      #board.show-hints .hint-num {
        display: block;
      }

      .puzzle-controls {
        margin-top: 20px;
        display: flex;
        gap: 12px;
        z-index: 1;
      }

      .note-peek {
        margin-top: 22px;
        max-width: 460px;
        text-align: center;
        font-family: "Caveat", cursive;
        font-size: 1.15rem;
        color: var(--berry);
        min-height: 1.4em;
        z-index: 1;
      }

      /* ============ COMPLETE OVERLAY ============ */
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(249, 230, 236, 0.97);
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 50;
        padding: 30px;
        text-align: center;
      }
      .overlay.show {
        display: flex;
      }
      .overlay .frame {
        max-width: 520px;
        background: var(--cream);
        border-radius: 22px;
        padding: 38px 30px;
        box-shadow: 0 20px 60px rgba(140, 47, 73, 0.25);
        position: relative;
      }
      .overlay h2 {
        font-size: clamp(1.6rem, 4vw, 2.1rem);
        margin-bottom: 10px;
      }
      .overlay .msg {
        font-size: 1.02rem;
        line-height: 1.7;
        color: #5a4550;
        margin-bottom: 26px;
      }
      .overlay .heart-burst {
        position: absolute;
        font-size: 22px;
        color: var(--rose);
        animation: burst 1.1s ease-out forwards;
        pointer-events: none;
      }
      @keyframes burst {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 1;
        }
        100% {
          transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy)))
            scale(1);
          opacity: 0;
        }
      }

      .final-note {
        font-family: "Caveat", cursive;
        font-size: 1.3rem;
        color: var(--berry-dark);
        margin-top: 8px;
      }

      footer.credit {
        position: absolute;
        bottom: 10px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 0.72rem;
        color: #b791a0;
        z-index: 1;
      }

      @media (max-width: 520px) {
        .node-card {
          width: calc(50% - 30px);
          min-width: 130px;
          padding: 10px 12px;
        }
        .vine::before {
          left: 50%;
        }
      }
    </style>
  </head>
  <body>
    <!-- ambient floating petals -->
    <div id="petals"></div>

    <!-- =================== WELCOME SCREEN =================== -->
    <section id="welcome" class="screen active">
      <div class="envelope-wrap">
        <div class="seal">&#10084;</div>
        <!-- EDIT ME: page title -->
        <h1>Fun little game</h1>
        <!-- EDIT ME: subtitle -->
        <p class="sub">
          a little world made of you, waiting to be put back together
        </p>
        <!-- EDIT ME: welcome note -->
        <p class="note">I hope you enjoy playing this. Take your time.</p>
        <button class="btn-primary" onclick="App.goTo('garden')">
          Begin your journey &nbsp;&#8594;
        </button>
      </div>
    </section>

    <!-- =================== GARDEN / LEVEL SELECT =================== -->
    <section id="garden" class="screen">
      <div class="heading">
        <!-- EDIT ME -->
        <h2>Your Garden of Moments</h2>
        <p class="progress-line" id="progressLine">0 of 6 blooms open</p>
      </div>
      <div class="vine" id="vine"></div>
      <footer class="credit">made with a whole heart, just for you</footer>
    </section>

    <!-- =================== PUZZLE SCREEN =================== -->
    <section id="puzzle" class="screen">
      <div class="puzzle-top">
        <button
          class="icon-btn"
          onclick="App.goTo('garden')"
          title="Back to garden"
        >
          &#8592;
        </button>
        <div class="puzzle-title">
          <span class="lvl-num" id="puzzleLvlNum">Chapter 1</span>
          <h2 id="puzzleLvlTitle">&nbsp;</h2>
        </div>
        <button class="icon-btn" id="musicToggle" title="Mute / unmute">
          &#127925;
        </button>
      </div>

      <div class="board-wrap">
        <div id="board"></div>
      </div>

      <div class="puzzle-controls">
        <button class="btn-ghost" onclick="Puzzle.toggleHints()">
          Show numbers
        </button>
        <button class="btn-ghost" onclick="Puzzle.shuffle()">
          Shuffle again
        </button>
      </div>

      <p class="note-peek" id="notePeek"></p>
    </section>

    <!-- =================== COMPLETE OVERLAY =================== -->
    <div class="overlay" id="completeOverlay">
      <div class="frame" id="completeFrame">
        <h2 id="completeTitle">You found it.</h2>
        <p class="msg" id="completeMsg"></p>
        <button
          class="btn-primary"
          id="completeBtn"
          onclick="App.afterComplete()"
        >
          Continue
        </button>
      </div>
    </div>

    <!-- audio elements, one per level -->
    <audio id="audio1" src="music1.mp3" loop></audio>
    <audio id="audio2" src="music2.mp3" loop></audio>
    <audio id="audio3" src="music3.mp3" loop></audio>
    <audio id="audio4" src="music4.mp3" loop></audio>
    <audio id="audio5" src="music5.mp3" loop></audio>
    <audio id="audio6" src="music6.mp3" loop></audio>

    <script>
      /* ============================================================
   EDIT ME: your six moments. size = grid size (3, 4 or 5).
   "title" shows on the garden path & puzzle header.
   "note" is the heartfelt line revealed once that puzzle is solved.
   "final" (only on the last level) is the closing message.
   ============================================================ */
      const LEVELS = [
        {
          id: 1,
          size: 3,
          img: "img1.jpeg",
          music: "audio1",
          title: "Your smile is unforgettable",
          note: "It lights up every room you walk into.",
        },
        {
          id: 2,
          size: 3,
          img: "img2.jpeg",
          music: "audio2",
          title: "You're effortlessly beautiful",
          note: "You don't have to try—your natural charm stands out.",
        },
        {
          id: 3,
          size: 4,
          img: "img3.jpeg",
          music: "audio3",
          title: "Your eyes are captivating.",
          note: "They have a way of expressing so much without saying a word.",
        },
        {
          id: 4,
          size: 4,
          img: "img4.jpeg",
          music: "audio4",
          title: "You have an amazing sense of style",
          note: "Everything you wear reflects your confidence and personality.",
        },
        {
          id: 5,
          size: 5,
          img: "img5.jpeg",
          music: "audio5",
          title: "You're genuinely kind",
          note: "The way you treat people makes you even more beautiful.",
        },
        {
          id: 6,
          size: 5,
          img: "img6.jpeg",
          music: "audio6",
          title: "You have a wonderful presence",
          note: "Being around you makes people feel comfortable and happy.",
          final:
            "This game may be over, but maybe it's also the beginning of something new. I'm really glad our paths crossed, and I hope this is the start of a great friendship. Here's to more laughs, fun conversations, and making more memories together.",
        },
      ];

      const STORAGE_KEY = "everyPieceOfUs.progress.v1";

      /* ---------------- progress ----------------
   In-memory only: progress resets whenever the page is reloaded.
   (Previously this was saved to localStorage; that's been removed
   on purpose so nothing persists between reloads.) */
      const Progress = {
        state: { completed: [false, false, false, false, false, false] },
        load() {
          /* intentionally does nothing — no persistence */
        },
        save() {
          /* intentionally does nothing — no persistence */
        },
        isUnlocked(index) {
          if (index === 0) return true;
          return this.state.completed[index - 1] === true;
        },
        isDone(index) {
          return this.state.completed[index] === true;
        },
        markDone(index) {
          this.state.completed[index] = true;
          this.save();
        },
      };

      /* ---------------- app / screen routing ---------------- */
      const App = {
        current: null,
        activeLevelIndex: 0,

        goTo(screenId) {
          document
            .querySelectorAll(".screen")
            .forEach((s) => s.classList.remove("active"));
          document.getElementById(screenId).classList.add("active");
          this.current = screenId;
          if (screenId === "garden") Garden.render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        },

        openLevel(index) {
          if (!Progress.isUnlocked(index)) return;
          this.activeLevelIndex = index;
          Puzzle.start(index);
          this.goTo("puzzle");
        },

        afterComplete() {
          document.getElementById("completeOverlay").classList.remove("show");
          this.goTo("garden");
        },
      };

      /* ---------------- garden (level select) ---------------- */
      const Garden = {
        render() {
          const vine = document.getElementById("vine");
          vine.innerHTML = "";
          let doneCount = 0;

          LEVELS.forEach((lvl, i) => {
            const unlocked = Progress.isUnlocked(i);
            const done = Progress.isDone(i);
            if (done) doneCount++;

            const row = document.createElement("div");
            row.className = "node-row";

            const card = document.createElement("div");
            card.className =
              "node-card " +
              (done ? "done" : unlocked ? "unlocked" : "locked") +
              (unlocked ? " playable" : "");
            card.onclick = () => App.openLevel(i);

            const flower = document.createElement("div");
            flower.className = "flower";
            const petalAngles = [0, 60, 120, 180, 240, 300];
            petalAngles.forEach((a) => {
              const p = document.createElement("div");
              p.className = "petal-el";
              p.style.setProperty("--r", a + "deg");
              flower.appendChild(p);
            });
            const core = document.createElement("div");
            core.className = "core";
            flower.appendChild(core);

            const text = document.createElement("div");
            text.className = "node-text";
            text.innerHTML = `
        <span class="lvl-num">Chapter ${i + 1}</span>
        <span class="lvl-title">${unlocked ? lvl.title : "???"}</span>
        <div class="lvl-meta">${lvl.size}\u00d7${lvl.size} &middot; ${done ? "complete" : unlocked ? "unlocked" : "locked"}</div>
      `;

            card.appendChild(flower);
            card.appendChild(text);
            row.appendChild(card);
            vine.appendChild(row);
          });

          document.getElementById("progressLine").textContent =
            `${doneCount} of ${LEVELS.length} blooms open`;
        },
      };

      /* ---------------- puzzle engine ---------------- */
      const Puzzle = {
        size: 3,
        order: [], // order[cellIndex] = pieceIndex currently shown there
        selected: -1,
        levelIndex: 0,
        currentAudioEl: null,

        start(levelIndex) {
          const lvl = LEVELS[levelIndex];
          this.levelIndex = levelIndex;
          this.size = lvl.size;

          document.getElementById("puzzleLvlNum").textContent =
            "Chapter " + (levelIndex + 1);
          document.getElementById("puzzleLvlTitle").textContent = lvl.title;
          document.getElementById("notePeek").textContent = "";

          // stop any other audio, play this level's track
          document.querySelectorAll("audio").forEach((a) => {
            a.pause();
            a.currentTime = 0;
          });
          this.currentAudioEl = document.getElementById(lvl.music);
          this.currentAudioEl.volume = 0.85;
          this.currentAudioEl.play().catch(() => {
            /* autoplay might be blocked until user gesture; button click already counts as a gesture in most browsers */
          });
          document.getElementById("musicToggle").textContent = "\u{1F3B5}";

          this.shuffle();
        },

        shuffle() {
          const total = this.size * this.size;
          let arr = [...Array(total).keys()];
          do {
            for (let i = arr.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [arr[i], arr[j]] = [arr[j], arr[i]];
            }
          } while (arr.every((v, i) => v === i)); // avoid an already-solved shuffle
          this.order = arr;
          this.selected = -1;
          this.render();
        },

        toggleHints() {
          document.getElementById("board").classList.toggle("show-hints");
        },

        render() {
          const board = document.getElementById("board");
          board.classList.remove("solving");
          board.innerHTML = "";
          board.style.gridTemplateColumns = `repeat(${this.size}, 1fr)`;
          const lvl = LEVELS[this.levelIndex];
          const total = this.size * this.size;

          for (let cell = 0; cell < total; cell++) {
            const pieceIdx = this.order[cell];
            const row = Math.floor(pieceIdx / this.size);
            const col = pieceIdx % this.size;

            const tile = document.createElement("div");
            tile.className = "tile";
            if (cell === pieceIdx) tile.classList.add("correct");
            tile.style.backgroundImage = `url('${lvl.img}')`;
            tile.style.backgroundSize = `${this.size * 100}% ${this.size * 100}%`;
            tile.style.backgroundPosition = `${(col * 100) / (this.size - 1)}% ${(row * 100) / (this.size - 1)}%`;
            tile.dataset.cell = cell;

            const num = document.createElement("span");
            num.className = "hint-num";
            num.textContent = pieceIdx + 1;
            tile.appendChild(num);

            tile.addEventListener("click", () => this.handleClick(cell));
            board.appendChild(tile);
          }
        },

        handleClick(cell) {
          if (this.selected === -1) {
            this.selected = cell;
            this.render();
            // reapply selected style after re-render
            const el = document.querySelector(`.tile[data-cell="${cell}"]`);
            if (el) el.classList.add("selected");
          } else if (this.selected === cell) {
            this.selected = -1;
            this.render();
          } else {
            // swap
            const a = this.selected,
              b = cell;
            [this.order[a], this.order[b]] = [this.order[b], this.order[a]];
            this.selected = -1;
            this.render();
            this.checkComplete();
          }
        },

        checkComplete() {
          const solved = this.order.every(
            (pieceIdx, cell) => pieceIdx === cell,
          );
          if (solved) {
            setTimeout(() => this.revealComplete(), 260);
          }
        },

        revealComplete() {
          // let the grid lines melt away so the full image shows clearly
          const board = document.getElementById("board");
          board.classList.add("solving");
          setTimeout(() => this.onSolved(), 2000);
        },

        onSolved() {
          const lvl = LEVELS[this.levelIndex];
          Progress.markDone(this.levelIndex);
          document.getElementById("notePeek").textContent = "";

          const overlay = document.getElementById("completeOverlay");
          const frame = document.getElementById("completeFrame");
          document.getElementById("completeTitle").textContent = lvl.final
            ? "Every piece, found."
            : "You put it back together.";
          let msg = lvl.note;
          if (lvl.final) {
            msg += "\n\n" + lvl.final;
          }
          document.getElementById("completeMsg").textContent = msg;
          document.getElementById("completeBtn").textContent =
            this.levelIndex === LEVELS.length - 1
              ? "Close, with all my love"
              : "Continue to next chapter";

          // little heart burst
          document.querySelectorAll(".heart-burst").forEach((h) => h.remove());
          for (let i = 0; i < 10; i++) {
            const h = document.createElement("span");
            h.className = "heart-burst";
            h.textContent = "\u2764";
            h.style.left = "50%";
            h.style.top = "20%";
            const angle = Math.random() * Math.PI * 2;
            const dist = 60 + Math.random() * 90;
            h.style.setProperty("--dx", Math.cos(angle) * dist + "px");
            h.style.setProperty("--dy", Math.sin(angle) * dist + "px");
            h.style.animationDelay = Math.random() * 0.2 + "s";
            frame.appendChild(h);
          }

          overlay.classList.add("show");
        },
      };

      /* ---------------- misc: music mute toggle, ambient petals ---------------- */
      document.getElementById("musicToggle").addEventListener("click", () => {
        const a = Puzzle.currentAudioEl;
        if (!a) return;
        a.muted = !a.muted;
        document.getElementById("musicToggle").textContent = a.muted
          ? "\u{1F507}"
          : "\u{1F3B5}";
      });

      (function petals() {
        const container = document.getElementById("petals");
        const symbols = ["\u2765", "\u2764", "\u273F"];
        for (let i = 0; i < 14; i++) {
          const p = document.createElement("div");
          p.className = "petal";
          p.textContent = symbols[i % symbols.length];
          p.style.left = Math.random() * 100 + "vw";
          p.style.animationDuration = 14 + Math.random() * 10 + "s";
          p.style.animationDelay = Math.random() * 10 + "s";
          p.style.fontSize = 12 + Math.random() * 14 + "px";
          container.appendChild(p);
        }
      })();

      /* ---------------- boot ---------------- */
      Progress.load();
      Garden.render();
    </script>
  </body>
</html>
